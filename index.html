<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DoveFacciamoFesta</title>
<meta name="description" content="Trova una sala per la tua festa nei patronati vicino a te. Gratis.">
<meta name="theme-color" content="#FFFBF4">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Festa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="DoveFacciamoFesta">
<meta property="og:description" content="Trova una sala per la tua festa nei patronati vicino a te. Gratis.">
<meta property="og:image" content="/icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#FFFBF4;overflow:hidden;font-family:Nunito,system-ui,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#splash{position:fixed;inset:0;background:#FFFBF4;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;transition:opacity .5s}
#splash.via{opacity:0;pointer-events:none}
#splash .ico{width:min(62vw,340px);height:min(62vw,340px);border-radius:22%;box-shadow:0 18px 50px rgba(242,97,63,.25);animation:su .9s ease-out}
#splash h1{font-family:Fredoka,sans-serif;font-weight:700;font-size:clamp(26px,7vw,40px);color:#2A2233;margin:26px 0 4px}
#splash h1 span{color:#F2613F}
#splash p{color:#7A6E86;margin:0;font-size:16px}
@keyframes su{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
#inst{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:#2A2233;color:#fff;border-radius:18px;padding:14px 14px 14px 16px;display:none;align-items:center;gap:12px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#inst img{width:44px;height:44px;border-radius:11px}
#inst .t{flex:1;font-size:14px;line-height:1.35}
#inst .t b{font-family:Fredoka,sans-serif;font-size:16px}
#inst button{border:0;border-radius:12px;font:700 15px Nunito,sans-serif;padding:10px 14px;cursor:pointer}
#ok{background:#F2613F;color:#fff}
#no{background:transparent;color:#bbb;padding:6px!important;font-size:20px!important}
#scegli{position:fixed;inset:0;background:#FFFBF4;z-index:15;display:none;overflow:auto;padding:28px 18px}
#scegli .box{max-width:520px;margin:0 auto}
#scegli h2{font-family:Fredoka,sans-serif;color:#2A2233;font-size:26px;margin:10px 0 4px}
#scegli p{color:#7A6E86;margin:0 0 16px}
#scegli a.req{display:block;background:#fff;border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:0 4px 0 #EDE3D3;color:#2A2233;text-decoration:none;font-weight:700;font-size:17px}
#scegli a.req small{display:block;color:#1E8C86;font-weight:700;font-size:13px;margin-top:2px}
#scegli a.nuova{display:block;text-align:center;background:#F2613F;color:#fff;border-radius:16px;padding:14px;margin-top:18px;font-family:Fredoka,sans-serif;font-size:18px;text-decoration:none;box-shadow:0 4px 0 #C9431F}
#scegli .logo{display:flex;align-items:center;gap:10px;font-family:Fredoka,sans-serif;font-size:22px;color:#2A2233;font-weight:700}
#scegli .logo img{width:44px;height:44px;border-radius:11px}
#scegli .logo span{color:#F2613F}
</style></head><body>
<div id="splash"><img class="ico" src="/icon-512.png" alt=""><h1>DoveFacciamo<span>Festa</span></h1><p>Trova la sala per la tua festa</p></div>
<div id="scegli"><div class="box"><div class="logo"><img src="/icon-192.png" alt="">DoveFacciamo<span>Festa</span></div><h2>Le tue richieste</h2><p>Tocca una richiesta per vedere quali sale hanno risposto.</p><div id="elenco"></div><a class="nuova" href="/?nuova=1">+ Nuova richiesta</a></div></div>
<iframe id="app" title="DoveFacciamoFesta" allow="geolocation; clipboard-write"></iframe>
<div id="inst"><img src="/icon-192.png" alt=""><div class="t" id="txt"><b>Installa l'app</b><br>Ritrovi le tue richieste con un tocco.</div><button id="ok">Installa</button><button id="no" aria-label="Chiudi">✕</button></div>
<script>
var EXEC='https://script.google.com/macros/s/AKfycbxrsNihzvoDlmQBks8nKTf6HcayAcY1H4tNLJGg5MM5te8JJZy7gzOGzGnxMFEihwW6/exec';var app=document.getElementById('app'),Q=new URLSearchParams(location.search);
function leggi(){try{var a=JSON.parse(localStorage.getItem('dff_req')||'[]'),oggi=new Date().toISOString().slice(0,10);return a.filter(function(x){return x&&x.r&&(!x.scade||x.scade>=oggi)})}catch(e){return []}}
function salva(a){try{localStorage.setItem('dff_req',JSON.stringify(a))}catch(e){}}
salva(leggi());
addEventListener('message',function(e){var d=e.data;if(!d||d.dff!=='richiesta'||!d.r)return;var a=leggi().filter(function(x){return x.r!==d.r});a.unshift({r:String(d.r),titolo:String(d.titolo||'La tua festa'),scade:String(d.scade||'')});salva(a.slice(0,10))});
var lista=leggi();
if(Q.get('r')){app.src=EXEC+'?r='+encodeURIComponent(Q.get('r'))}
else if(Q.get('nuova')||!lista.length){app.src=EXEC}
else{var el=document.getElementById('elenco');lista.forEach(function(x){var a=document.createElement('a');a.className='req';a.href='/?r='+encodeURIComponent(x.r);a.textContent=x.titolo;var s=document.createElement('small');s.textContent='Vedi le risposte delle sale';a.appendChild(s);el.appendChild(a)});document.getElementById('scegli').style.display='block';app.style.display='none'}
var t0=Date.now(),splash=document.getElementById('splash');
function chiudi(){var w=Math.max(0,1600-(Date.now()-t0));setTimeout(function(){splash.classList.add('via')},w)}
app.addEventListener('load',chiudi);setTimeout(chiudi,app.src?6000:1800);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
var box=document.getElementById('inst'),ok=document.getElementById('ok'),ev=null;
function nascosto(){try{return Date.now()-(+localStorage.getItem('dff_no')||0)<3*864e5}catch(e){return false}}
document.getElementById('no').onclick=function(){box.style.display='none';try{localStorage.setItem('dff_no',Date.now())}catch(e){}};
addEventListener('beforeinstallprompt',function(e){e.preventDefault();ev=e;if(!standalone&&!nascosto())setTimeout(function(){box.style.display='flex'},2500)});
ok.onclick=function(){if(ev){ev.prompt();ev.userChoice.then(function(){box.style.display='none'})}};
addEventListener('appinstalled',function(){box.style.display='none'});
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
if(ios&&!standalone&&!nascosto()){document.getElementById('txt').innerHTML='<b>Installa l\'app</b><br>Tocca <b>Condividi</b> <svg width="14" height="16" viewBox="0 0 14 16" style="vertical-align:-2px"><path d="M7 1v9M3.5 4.5 7 1l3.5 3.5M2 7v8h10V7" stroke="#fff" stroke-width="1.6" fill="none"/></svg> e poi <b>Aggiungi a Home</b>';ok.style.display='none';setTimeout(function(){box.style.display='flex'},3000)}
</script></body></html>
